architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    // Fabric mod id used by the dev runs / fabric.mod.json entrypoints.
}

configurations {
    common
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    modApi "dev.architectury:architectury-fabric:${rootProject.architectury_api_version}"

    // Shared code lives in :common and is merged into this jar (see `jar` below).
    common(project(path: ":common", configuration: "namedElements")) { transitive = false }
}

/// Merge the shared module (classes + resources) into the platform artifact.
/// The platform `remapJar` task then remaps those classes together with ours, so the
/// shipped jar is a single, self-contained mod.
jar {
    from { configurations.common.collect { zipTree(it) } }
}

processResources {
    def props = [
            version          : project.version,
            mod_id           : rootProject.mod_id,
            mod_name         : rootProject.mod_name,
            mod_license      : rootProject.mod_license,
            mod_authors      : rootProject.mod_authors,
            mod_description  : rootProject.mod_description,
            minecraft_version: rootProject.minecraft_version,
            architectury_api : rootProject.architectury_api_version,
            fabric_loader    : rootProject.fabric_loader_version
    ]
    inputs.properties props
    filesMatching("fabric.mod.json") {
        expand props
    }
}

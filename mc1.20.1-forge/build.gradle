plugins {
    // 钉选 6.0.54（MDK 写 [6.0,6.2)）；版本更新时同步 versions.js 矩阵。
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
}

version = "0.1.0"
group = "dev.emccasino"
archivesBaseName = "emc-casino"

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        client {
            workingDirectory project.file('run')
        }
        server {
            workingDirectory project.file('run')
        }
        gameTestServer {
            workingDirectory project.file('run')
        }
        data {
            workingDirectory project.file('run')
            args '--mod', mod_id, '--all'
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:1.20.1-47.3.0"
}

// mods.toml / pack.mcmeta 里的 ${mod_id} 等由 Gradle expand 替换（与 scaffold 的 {{}} 不冲突）。
def replaceProperties = [
    minecraft_version: "1.20.1", forge_version: "47.3.0",
    mod_id: "emc_casino", mod_name: "EMC Casino", mod_license: "MIT",
    mod_version: version, mod_authors: "Antigravity", mod_description: "EMC Casino mod",
    loader_version_range: "[47,)", forge_version_range: "[47,)", minecraft_version_range: "[1.20.1,1.21)"
]

processResources {
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand replaceProperties }
}

jar {
    manifest {
        attributes([
            "Specification-Title": mod_id,
            "Implementation-Version": project.version,
        ])
    }
    finalizedBy 'reobfJar'
}

plugins {
    id 'java-library'
    id 'maven-publish'
    // 1.20.1 路线：legacyforge 插件对 Forge 47.1.3 坐标开发（官方 MDK 现状，见方案 R6）。
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
    id 'idea'
}

version = "0.1.6"
group = "dev.casino"

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    version = "1.20.1-47.1.3"
    parchment {
        mappingsVersion = "2023.09.03"
        minecraftVersion = "1.20.1"
    }
    runs {
        client { client() }
        server { server() }
        data { data() }
    }
    mods {
        "casino" { sourceSet sourceSets.main }
    }
}

// Expand only the text metadata templates; binary assets (PNG textures) must be copied verbatim.
processResources {
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta', '**/*.json']) {
        expand project.properties
    }
}

// Unit tests for the plain-Java game engines (no Minecraft types involved).
repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    // The blackjack table serialises its state to gson, so its unit tests need gson on the
    // test classpath. Loom and ForgeGradle put the game libraries there automatically;
    // moddev does not, so it is declared explicitly.
    testImplementation "com.google.code.gson:gson:2.10.1"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "failed", "skipped"
    }
}

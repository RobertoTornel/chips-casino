modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description="EMC-based casino and gambling machines with a ProjectE-style economy (0.8x deposit / 1.2x withdraw), six game tables, a sprite-driven themable UI, multiplayer Texas Hold'em seating and server-side bots."

[[dependencies.${mod_id}]]
modId="forge"
versionRange="${forge_version_range}"
mandatory=true

[[dependencies.${mod_id}]]
modId="minecraft"
versionRange="${minecraft_version_range}"
mandatory=true
